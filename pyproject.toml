[project]
name = "observe-d"
version = "0.1.0"
description = "LLM inference observability: GPU → k8s → network → llm-d → vLLM → tokenomics → traceability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "prometheus-client>=0.21",
    "aiohttp>=3.14.5",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "testcontainers[clickhouse]>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"grafana/build.py" = ["RUF001"]  # panel titles use × and −

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sql: needs Docker (testcontainers ClickHouse)",
    "e2e: needs the full local stack (docker compose + kind)",
]
