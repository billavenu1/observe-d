# Capacity-test generator (sim/telemetry_replay.py) as a Job next to the agent collector.
# Created by `python -m tools.dev load`; placeholders filled in there.
apiVersion: batch/v1
kind: Job
metadata:
  name: replay-__RUN_ID__
  namespace: observe-d
  labels: {app.kubernetes.io/name: telemetry-replay, observe-d.io/run-id: "__RUN_ID__"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  completionMode: Indexed     # each pod gets JOB_COMPLETION_INDEX -> its own seed; rate is split evenly
  completions: __PARALLELISM__
  parallelism: __PARALLELISM__
  template:
    metadata:
      labels: {app.kubernetes.io/name: telemetry-replay}
    spec:
      restartPolicy: Never
      containers:
        - name: replay
          image: localhost/observe-d-sim:dev
          imagePullPolicy: Never
          args: [sim.telemetry_replay]
          env:
            - {name: OTLP_ENDPOINT, value: "otel-agent.observe-d.svc.cluster.local:4317"}
            - {name: RUN_ID, value: "__RUN_ID__"}
            - {name: RATE, value: "__RATE__"}
            - {name: DURATION, value: "__DURATION__"}
            - {name: BURST_RATE, value: "__BURST_RATE__"}
            - {name: BURST_AT, value: "__BURST_AT__"}
            - {name: BURST_DURATION, value: "__BURST_DURATION__"}
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {memory: 512Mi}
---
# Collector self-metrics in Prometheus (dropped / refused / failed counters for the acceptance checks).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: otel-agent, namespace: observe-d}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: otel-agent}}
  podMetricsEndpoints:
    - {port: metrics, interval: 15s}
