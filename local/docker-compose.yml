# Local backend (slim profile): Kafka + ClickHouse + OTel gateway collector.
# Joins the `kind` network so pods in the kind cluster can reach it. Static IPs are used because
# pods resolve these names through hostAliases (see local/kind/), not through podman DNS.
#
#   podman-compose -f local/docker-compose.yml up -d   (or docker compose; tools/dev.py up does this and
#   sets *_IP from the kind network subnet)

name: observe-d

networks:
  kind:
    external: true

volumes:
  kafka-data: {}
  clickhouse-data: {}

services:
  kafka:
    image: docker.io/apache/kafka:4.1.0
    container_name: od-kafka
    hostname: kafka
    networks:
      kind: {ipv4_address: "${KAFKA_IP:-10.89.0.100}"}
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # combined broker+controller: reach the controller via localhost, not the network DNS name
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xms768m -Xmx768m   # 384m GC-thrashed under load and fenced the broker
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      # needs a working controller quorum (api-versions alone stayed "healthy" while the broker was fenced)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:9092 describe --status >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3
    container_name: od-clickhouse
    hostname: clickhouse
    networks:
      kind: {ipv4_address: "${CLICKHOUSE_IP:-10.89.0.101}"}
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/config/observe-d.xml:/etc/clickhouse-server/config.d/observe-d.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user otel --password otel -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24

  otel-gateway:
    image: docker.io/otel/opentelemetry-collector-contrib:0.156.0
    container_name: od-otel-gateway
    networks:
      kind: {ipv4_address: "${GATEWAY_COLLECTOR_IP:-10.89.0.102}"}
    command: ["--config=/etc/otelcol/gateway.yaml"]
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      KAFKA_BROKERS: kafka:9092
    ports: ["8888:8888"]   # collector self-metrics
    volumes:
      - ../collector/gateway.yaml:/etc/otelcol/gateway.yaml:ro
    depends_on: [kafka, clickhouse]
    restart: unless-stopped
