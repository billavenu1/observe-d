# Vendor-neutral Kubernetes GPU allocation (MVP.md §3.2). kube-state-metrics exposes extended resources as
# nvidia_com_gpu / amd_com_gpu; these rules fold both into k8s:gpu_* with a `vendor` label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8s-gpu
  labels: {app.kubernetes.io/part-of: observe-d}
spec:
  groups:
    - name: k8s-gpu
      rules:
        - record: k8s:gpu_allocatable
          expr: |
            label_replace(
              sum by (node, resource) (kube_node_status_allocatable{resource=~"nvidia_com_gpu|amd_com_gpu"}),
              "vendor", "$1", "resource", "(nvidia|amd)_com_gpu")
        - record: k8s:gpu_requested_by_pod
          expr: |
            label_replace(
              sum by (namespace, pod, node, resource) (
                kube_pod_container_resource_requests{resource=~"nvidia_com_gpu|amd_com_gpu"}
                * on (namespace, pod) group_left() max by (namespace, pod) (kube_pod_status_phase{phase=~"Running|Pending"})
              ),
              "vendor", "$1", "resource", "(nvidia|amd)_com_gpu")
        - record: k8s:gpu_requested
          expr: sum by (node, vendor) (k8s:gpu_requested_by_pod)
